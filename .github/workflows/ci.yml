name: CI

on:
  push:
    branches: ["**"]
    tags: ["v[0-9]*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  compatibility:
    name: Swift 6.0.3 compatibility
    runs-on: macos-15
    timeout-minutes: 30
    env:
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Verify toolchain
        run: |
          swiftc --version | grep -F "Apple Swift version 6.0.3"
          test "$(xcrun --sdk macosx --show-sdk-version)" = "15.2"

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Unit tests
        run: ./build.sh --test

  build:
    name: Build & selftest
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Build
        run: ./build.sh

      - name: Selftest
        run: ./build/Vorssaint --selftest

      - name: Package DMG
        run: ./Tools/make-dmg.sh

      - name: Unit tests
        run: ./build.sh --test

      - name: Verify packaged app and record provenance
        shell: bash
        run: |
          set -euo pipefail
          DMG="dist/Vorssaint-$(/usr/libexec/PlistBuddy -c 'Print CFBundleShortVersionString' Resources/Info.plist).dmg"
          hdiutil verify "$DMG"
          MP=$(mktemp -d)
          trap 'hdiutil detach "$MP" -quiet || true; rmdir "$MP" || true' EXIT
          hdiutil attach "$DMG" -readonly -nobrowse -mountpoint "$MP"
          codesign --verify --deep --strict "$MP/Vorssaint.app"
          diff -qr build/stage/Vorssaint.app "$MP/Vorssaint.app"
          cp "$DMG" "dist/Vorssaint-${GITHUB_SHA}.dmg"
          rm "$DMG"
          (cd dist && shasum -a 256 ./*.dmg > SHA256SUMS)
          {
            echo "Repository: $GITHUB_REPOSITORY"
            echo "Commit: $GITHUB_SHA"
            echo "Ref: $GITHUB_REF"
            echo "Run: $GITHUB_SERVER_URL/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID"
            echo "Architecture: arm64; requires macOS 14 or later"
            echo "CI build: ad-hoc signed, not Apple notarized."
          } > dist/BUILD-INFO.txt
          cat dist/BUILD-INFO.txt >> "$GITHUB_STEP_SUMMARY"

      - name: Upload verified DMG
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: Vorssaint-dmg-${{ github.sha }}
          path: |
            dist/*.dmg
            dist/SHA256SUMS
            dist/BUILD-INFO.txt
          if-no-files-found: error
          retention-days: 30
          compression-level: 0
